<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirana+ — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      padding: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #1e293b; border-color: #334155; }
      .subtitle { color: #94a3b8; }
      .retry-btn { background: #16a34a; }
      .retry-btn:hover { background: #15803d; }
      .wifi-icon { color: #64748b; }
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      color: #1e293b;
    }

    @media (prefers-color-scheme: dark) {
      .logo { color: #f1f5f9; }
    }

    .logo span { color: #7c3aed; }

    .wifi-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      color: #94a3b8;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 15px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: #16a34a;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    }

    .retry-btn:hover {
      background: #15803d;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.35);
    }

    .retry-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">Kirana<span>+</span></div>

      <svg class="wifi-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01M4.93 13.222a9.003 9.003 0 0114.14 0M1.394 9.393c5.861-5.861 15.355-5.861 21.213 0" />
        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>

      <h1 class="title">You're Offline</h1>
      <p class="subtitle">
        Please check your internet connection and try again.
      </p>

      <button class="retry-btn" onclick="window.location.reload()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Retry
      </button>

      <p class="footer-note">
        Previously cached pages may still be available.
      </p>
    </div>
  </div>
</body>
</html>
